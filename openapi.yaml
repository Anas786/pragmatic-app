        passthroughBehavior: when_no_match
        contentHandling: CONVERT_TO_TEXT

  /private/data/connectivity:
    get:
      summary: Get sites connectivity status
      description: |
        Retrieves real-time connectivity status and telemetry data for all authorized sites.
        This endpoint provides comprehensive site state information including:
        - Site connectivity status
        - Last update timestamps
        - Telemetry data values
        - Site metadata

        Access is role-based:
        - Client Admins: Access to all sites within their client
        - Customer Admins: Access to all sites within their customer
        - Regular Users: Access only to their authorized sites

        The data is retrieved from high-performance Redis cache with real-time updates.
        Requires authentication via Cognito Bearer JWT token with appropriate role permissions.
      operationId: getSitesConnectivity
      security:
        - CognitoAuthorizer: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
                    properties:
                      source:
                        type: string
                        description: Data source
                        example: "cache"
                      responseType:
                        type: string
                        description: Response type
                        example: "original"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        siteId:
                          type: string
                          description: Unique identifier for the site
                          example: "59378f44-a09e-4207-a07d-777df3f720ee"
                        state:
                          type: string
                          enum: ["Online", "Offline"]
                          description: Current connectivity state of the site
                          example: "Online"
                        dataLastUpdate:
                          type: string
                          description: Timestamp of last data update in milliseconds
                          example: "1757878680000"
                        deviceEventType:
                          type: string
                          enum: ["connected", "disconnected"]
                          description: Last device event type (optional)
                          example: "disconnected"
                        deviceLastUpdate:
                          type: string
                          description: Timestamp of last device event in milliseconds (optional)
                          example: "1757859961409"
                        deviceDisconnectReason:
                          type: string
                          enum:
                            [
                              "DUPLICATE_CLIENTID",
                              "MQTT_KEEP_ALIVE_TIMEOUT",
                              "CONNECTION_LOST",
                              "WEBSOCKET_TTL_EXPIRATION",
                            ]
                          description: Reason for device disconnection (optional, only present when deviceEventType is disconnected)
                          example: "DUPLICATE_CLIENTID"
                      required:
                        - siteId
                        - state
                        - dataLastUpdate
                    description: Array of site connectivity states with telemetry and device status
                description: Sites connectivity data with metadata
        "401":
          description: Unauthorized - Invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Insufficient privileges or no site access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Private Live Data
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PrivateLiveServiceFunction.Arn}/invocations"
        passthroughBehavior: when_no_match
        contentHandling: CONVERT_TO_TEXT

  /private/data/v2/timeseries/{id}:
    get:
      summary: Get timeseries data
      description: |
        Retrieves timeseries data with aggregations for a specific site.
        Supports flexible time ranges using epoch timestamps or SQL expressions.
        Data can be retrieved as raw values or report data with customizable
        aggregation intervals and methods.

        Requires elevated privileges with admin role evaluation.

        Example curl:
        ```bash
        curl --location 'https://api.example.com/private/data/v2/timeseries/ce3901ce-936b-4611-8222-cf7e4b2822e8?start=now%28%29+-+INTERVAL+24+HOUR&end=now%28%29&aggregations=%7B%22p1003%22%3A%22avg%22%2C%22p1006%22%3A%22avg%22%2C%22p16%22%3A%22avg%22%2C%22p4%22%3A%22avg%22%7D&interval=5&unit=MINUTE&data_type=raw' \
        --header 'Accept: application/json' \
        --header 'Authorization: Bearer {token}'
        ```
      operationId: getPrivateTimeseriesData
      security:
        - CognitoAuthorizer: []
      x-amazon-apigateway-request-validator: params-only
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: "ce3901ce-936b-4611-8222-cf7e4b2822e8"
          description: Site UUID for which to retrieve timeseries data
        - name: aggregations
          in: query
          required: true
          schema:
            type: string
            minLength: 2
          description: |
            JSON object mapping parameter names to aggregation methods.
            Supported aggregation methods: avg, min, max, sum, count.
            Example: {"p1003":"avg","p1006":"avg","p16":"avg","p4":"avg"}
          example: '{"p1003":"avg","p1006":"avg","p16":"avg","p4":"avg"}'
        - name: interval
          in: query
          required: true
          schema:
            type: string
            enum: ["1", "5", "15", "30"]
          description: |
            Aggregation interval value. The actual time window is determined
            by combining this with the unit parameter (e.g., 5 MINUTE, 1 HOUR)
          example: "5"
        - name: unit
          in: query
          required: true
          schema:
            type: string
            enum: ["MINUTE", "HOUR", "DAY", "WEEK"]
          description: |
            Time unit for the aggregation interval.
            Combines with interval parameter to define the aggregation window.
          example: "MINUTE"
        - name: data_type
          in: query
          required: true
          schema:
            type: string
            enum: ["raw", "report"]
          description: |
            Type of data source to query:
            - raw: Query raw telemetry data tables
            - report: Query pre-processed report data tables
          example: "raw"
        - name: start
          in: query
          required: false
          schema:
            type: string
          description: |
            Start time for the data query. Can be:
            - Epoch timestamp in milliseconds (e.g., "1757876400000")
            - SQL expression (e.g., "now() - INTERVAL 24 HOUR")
          default: "now() - INTERVAL 24 HOUR"
          example: "now() - INTERVAL 24 HOUR"
        - name: end
          in: query
          required: false
          schema:
            type: string
          description: |
            End time for the data query. Can be:
            - Epoch timestamp in milliseconds (e.g., "1757962800000")
            - SQL expression (e.g., "now()")
          default: "now()"
          example: "now()"
      responses:
        "200":
          description: Successful response with timeseries data
          content:
            application/json:
              schema:
                type: object
                required:
                  - metadata
                  - data
                properties:
                  metadata:
                    type: object
                    required:
                      - siteId
                      - start
                      - end
                    properties:
                      siteId:
                        type: string
                        format: uuid
                        example: "ce3901ce-936b-4611-8222-cf7e4b2822e8"
                      start:
                        type: string
                        example: "now() - INTERVAL 24 HOUR"
                      end:
                        type: string
                        example: "now()"
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - time
                      properties:
                        time:
                          type: integer
                          format: int64
                          description: Unix timestamp in milliseconds
                          example: 1757885700000
                      additionalProperties:
                        type: number
                        format: float
                        nullable: true
                        description: Aggregated value for each parameter
                example:
                  metadata:
                    siteId: "ce3901ce-936b-4611-8222-cf7e4b2822e8"
                    start: "now() - INTERVAL 24 HOUR"
                    end: "now()"
                  data:
                    - time: 1757885700000
                      p1003: 30.299999237060547
                      p1006: 0.0
                      p16: 0.0
                      p4: 29.233333587646484
                    - time: 1757886000000
                      p1003: 30.22000045776367
                      p1006: 0.0
                      p16: 0.0
                      p4: 29.100000381469727
        "400":
          description: Invalid aggregations provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - Invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Insufficient privileges or no admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Private Data V2
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PrivateDataV2ServiceFunction.Arn}/invocations"
        passthroughBehavior: when_no_match
        contentHandling: CONVERT_TO_TEXT

  /private/data/v2/multisite/summary/{id}:
    get:
      summary: Get multisite summary
      description: |
        Retrieves summary data for multiple sites based on predefined query configuration.
        Combines site information with live and processed parameter data.

        Requires authentication via Cognito Bearer JWT token with elevated privileges.
        Access is limited to authorized sites based on user permissions.
      operationId: getPrivateSitesSummary
      security:
        - CognitoAuthorizer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: |
            Predefined query configuration ID stored in Redis.
            This ID references a specific multisite summary configuration
            that defines which parameters to retrieve from live and processed data.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
                    properties:
                      source:
                        type: string
                        example: "cache"
                      responseType:
                        type: string
                        example: "original"
                      specific:
                        type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        size:
                          type: number
                        id:
                          type: string
        "400":
          description: Invalid query id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - Invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Insufficient privileges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
        - Private Data V2
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PrivateDataV2ServiceFunction.Arn}/invocations"
        passthroughBehavior: when_no_match
        contentHandling: CONVERT_TO_TEXT

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message describing what went wrong
        statusCode:
          type: integer
          description: HTTP status code
      required:
        - error
        - statusCode

  securitySchemes:
    CognitoAuthorizer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito JWT Bearer token authentication
      x-amazon-apigateway-authtype: cognito_user_pools
      x-amazon-apigateway-authorizer:
        type: cognito_user_pools
        providerARNs:
          - Fn::Sub: "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/{{resolve:ssm:/auth-cognito-services/cognito/user/pool/id:1}}"

x-amazon-apigateway-request-validators:
  params-only:
    validateRequestParameters: true
    validateRequestBody: false
  params-and-body:
    validateRequestParameters: true
    validateRequestBody: true

tags:
  - name: Configuration
    description: |
      Configuration management endpoints providing access to cached settings
      for UI parameters, report mappings, and alarm configurations. All data
      is served from Redis cache for high performance and low latency.
  - name: Protected Configuration
    description: |
      Protected configuration endpoints requiring authentication via Cognito.
      These endpoints provide access to sensitive configuration data including
      site configurations and administrative parameters.
  - name: Private Configuration
    description: |
      Private configuration endpoints requiring authentication via Cognito with
      elevated privileges. These endpoints provide access to highly sensitive
      client configuration data including API keys, service endpoints, and
      authentication settings. Access is strictly controlled and all requests
      are audited for security compliance.
  - name: Protected Live Data
    description: |
      Protected real-time data endpoints requiring authentication via Cognito.
      These endpoints provide access to live telemetry data, processed values,
      and active alarms for authorized sites.
  - name: Protected Data V2
    description: |
      Protected data v2 endpoints requiring authentication via Cognito.
      These endpoints provide advanced data querying capabilities including
      timeseries data with aggregations, trend analysis, reporting, and
      multisite summaries. All data is retrieved from ClickHouse for high-performance
      analytical queries with support for various time ranges and aggregation methods.
  - name: Private Live Data
    description: |
      Private real-time data endpoints requiring authentication via Cognito with
      elevated privileges. These endpoints provide access to comprehensive site
      connectivity status and telemetry data with role-based access control.
      Client and Customer Admins have broader access compared to regular users.
  - name: Private User Configuration
    description: |
      Private user configuration endpoints requiring authentication via Cognito.
      These endpoints provide access to user-specific configuration data including
      site lists, customer lists, and user lists. Access is role-based with
      Client Admins and Customer Admins having broader access to user data
      within their respective scopes.
  - name: Private Data V2
    description: |
      Private data v2 endpoints requiring authentication via Cognito with
      elevated privileges. These endpoints provide advanced data querying capabilities
      including timeseries data with aggregations. Access requires admin role evaluation
      and appropriate site authorization. All data is retrieved from ClickHouse for
      high-performance analytical queries with support for various time ranges and
      aggregation methods.
