                  example: '{"clientId":"1","createdBy":"client:1","isClientAdmin":false,"customerId":"52","updateAt":1710639958,"id":"1bc1379b-5e14-430e-9658-d06426323fd6","isCustomerAdmin":true,"email":"mansoorrana_2001@yahoo.com"}'
                description: Array of JSON-encoded user strings. Each string contains a user object with details including id, email, clientId, customerId (optional), isClientAdmin, isCustomerAdmin, sites (optional array), createdBy, updateAt (optional), and isDemoUser (optional)
          headers:
            Cache-Control:
              schema:
