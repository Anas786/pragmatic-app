                      type: string
                      format: uuid
                      description: Unique identifier for the site
                      example: "c01ef6c7-43c5-4d83-aa8e-22d8b21309c1"
                    name:
                      type: string
                      description: Name of the site
                      example: "AJ Textiles"
                    logo_ext:
